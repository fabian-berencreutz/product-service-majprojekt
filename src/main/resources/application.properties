spring.application.name=product-service-majprojekt

# Database configuration (H2 local default, PostgreSQL in prod via env vars)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:productdb;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.database-platform=${JPA_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

server.port=${SERVER_PORT:8081}
server.forward-headers-strategy=framework

# OAuth2 / JWKS URI (fallback for local dev)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://localhost:8080/auth/jwks}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175}